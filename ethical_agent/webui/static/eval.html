<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ethical Agent — Eval</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6feb'/%3E%3Cpath d='M16 6 26 10.5v6.4c0 6.6-4.4 10.3-10 12.1-5.6-1.8-10-5.5-10-12.1v-6.4z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <div class="ea-page">
      <header class="ea-topbar">
        <span class="ea-topbar__title">Ethical Agent</span>
        <nav id="ea-nav"></nav>
        <button type="button" id="ea-config-toggle" aria-expanded="false" aria-controls="ea-config-panel">
          Configuração
        </button>
      </header>

      <div id="ea-config-panel" hidden></div>
      <div id="ea-banner-host"></div>

      <main>
        <div class="ea-column ea-chat-column ea-tool-column">
          <p class="ea-tool-intro">
            Roda um dataset rotulado contra a engine e reporta métricas. 
            <strong>Não grava na
            trilha de auditoria</strong>. Datasets grandes podem demorar.
          </p>

          <form id="ea-eval-form" class="ea-tool-form">
            <label for="ea-eval-dataset">Dataset</label>
            <div class="ea-config-panel__input-row">
              <input type="text" id="ea-eval-dataset" autocomplete="off" spellcheck="false" />
              <button type="button" id="ea-eval-browse" class="ea-config-panel__browse">Procurar…</button>
            </div>

            <button type="submit" id="ea-eval-submit">Rodar eval</button>
          </form>

          <div id="ea-eval-result" class="ea-tool-result"></div>
        </div>
      </main>
    </div>

    <script type="module" src="/static/js/tools/eval.js"></script>
  </body>
</html>
