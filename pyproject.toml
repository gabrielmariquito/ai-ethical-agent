[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ethical-agent"
version = "0.3.0"
description = "Neuro-symbolic ethical guardrails for Foundation-Model-based agents: a rule-based + constraint engine and a RelAIEO knowledge-graph engine."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai-safety", "guardrails", "ai-ethics", "llm", "ontology", "neuro-symbolic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The core engine (types/conditions/policy/ontology/engine/agent) has zero
# runtime dependencies on purpose -- it's auditable stdlib-only symbolic code.
dependencies = []

[project.optional-dependencies]
# Needed only for `ethical_agent process` (a real LLM via Ollama).
llm = ["ollama>=0.3", "python-dotenv>=1.0"]
dev = ["pytest>=8", "setuptools>=68", "wheel"]

[project.scripts]
ethical-agent = "ethical_agent.__main__:main"

[tool.setuptools]
# policies/, ontologies/ and eval/ are siblings of ethical_agent/ on disk, and
# the default_*_path() helpers (ethical_agent/policy.py, ethical_agent/relaieo.py)
# resolve them via Path(__file__).resolve().parents[1] / "<dir>" -- one level
# above the installed package, i.e. site-packages root in a non-editable
# install. Listing them here ships them at that same relative location so
# `pip install .` (not just `pip install -e .`) produces a working install.
packages = ["ethical_agent", "policies", "ontologies", "eval"]

[tool.setuptools.package-data]
policies = ["*.json"]
ontologies = ["*.ttl", "*.json", "*.md"]
eval = ["*.json"]
