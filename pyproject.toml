[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ethical-agent"
version = "0.3.0"
description = "Neuro-symbolic ethical guardrails for Foundation-Model-based agents: a rule-based + constraint engine and a RelAIEO knowledge-graph engine."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai-safety", "guardrails", "ai-ethics", "llm", "ontology", "neuro-symbolic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The core engine (types/conditions/policy/ontology/engine/agent) has zero
# runtime dependencies on purpose -- it's auditable stdlib-only symbolic code.
dependencies = []

[project.optional-dependencies]
# Needed only for `ethical_agent process` (a real LLM via Ollama).
llm = ["ollama>=0.3", "python-dotenv>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
ethical-agent = "ethical_agent.__main__:main"

[tool.setuptools]
packages = ["ethical_agent"]
